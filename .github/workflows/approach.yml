name: Port approaches (OSM waterways)
on:
  schedule:
    - cron: '47 6 * * 2'     # every Tuesday 06:47 UTC (after the Monday network / TSS updates)
  workflow_dispatch:
    inputs:
      commit:
        description: 'commit the result'
        default: 'true'
permissions:
  contents: write
concurrency: { group: approach, cancel-in-progress: false }
jobs:
  approach:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: Purpledevil75/Task-Force-Supreme, path: app-src }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Free disk space, install osmium
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool aria2
          pip install -q osmium
          df -h / | tail -1
      - name: Land raster and planet file
        run: |
          mkdir -p app-src/app/data /home/runner/w
          curl -sL -o app-src/app/data/land_i.bin https://github.com/Purpledevil75/Task-Force-Supreme/releases/download/mapdata-v1/land_i.bin
          ls -la app-src/app/data
          URL=""
          for B in osm-planet-eu-central-1 osm-planet-us-west-2; do
            K=$(aws s3 ls --no-sign-request --recursive s3://$B/planet/pbf/ 2>/dev/null | awk '{print $4}' | grep -E 'planet-[0-9]+\.osm\.pbf$' | sort | tail -1)
            echo "$B: $K"; if [ -n "$K" ]; then URL="https://$B.s3.amazonaws.com/$K"; break; fi
          done
          [ -n "$URL" ] || URL="https://ftp5.gwdg.de/pub/misc/openstreetmap/planet.openstreetmap.org/pbf/planet-latest.osm.pbf"
          echo "planet: $URL"; t0=$(date +%s)
          aria2c -q -x 16 -s 16 -k 64M --file-allocation=none -d /home/runner/w -o planet.osm.pbf "$URL"
          echo "downloaded in $(( $(date +%s) - t0 )) s"; ls -la /home/runner/w; df -h / | tail -1
      - name: Navigable waterways near ports
        run: |
          cd /home/runner/w; t0=$(date +%s)
          osmium tags-filter --overwrite -o ways.pbf planet.osm.pbf w/waterway=river,canal,fairway,tidal_channel w/seamark:type=fairway,recommended_track,navigation_line
          rm -f planet.osm.pbf; ls -la; echo "filtered in $(( $(date +%s) - t0 )) s"
          python $GITHUB_WORKSPACE/tools/approach/dump.py ways.pbf ways.jsonl $GITHUB_WORKSPACE/app-src/app/p2p/ports.js
          rm -f ways.pbf /tmp/nodes.idx; ls -la; echo "dumped in $(( $(date +%s) - t0 )) s"
      - name: Build approaches
        run: |
          mkdir -p approach
          node --max-old-space-size=13000 app-src/tools/approach/build.cjs /home/runner/w/ways.jsonl --out approach/approach.json 2>&1 | tee approach/build.log
          ls -la approach
      - name: Commit
        if: ${{ (inputs.commit || 'true') == 'true' }}
        run: |
          git config user.name approach-bot; git config user.email ci@users.noreply.github.com
          mkdir -p /tmp/keep && cp approach/approach.json approach/build.log /tmp/keep/
          for a in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p approach; cp /tmp/keep/* approach/
            python tools/manifest.py approach
            git add approach manifest.json
            git commit -qm "Port approaches update $(date -u +'%F %H:%M')" || break
            git push -q && break || sleep 15
          done
