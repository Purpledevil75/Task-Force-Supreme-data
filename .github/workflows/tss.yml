name: Update TSS data (OSM seamarks)
on:
  schedule:
    - cron: '23 2 * * 1'     # every Monday 02:23 UTC
  workflow_dispatch:
    inputs:
      source:
        description: 'geofabrik (country extracts, reliable) or overpass (fast when the servers are not busy)'
        default: geofabrik
      limit:
        description: 'geofabrik: only the first N regions (0 = all; for a quick test)'
        default: '0'
      commit:
        description: 'commit the result'
        default: 'true'
permissions:
  contents: write
concurrency: { group: tss, cancel-in-progress: false }
jobs:
  tss:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Free disk space and install osmium
        if: ${{ (inputs.source || 'geofabrik') == 'geofabrik' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          df -h / | tail -1
      - name: Extract from Geofabrik country files
        if: ${{ (inputs.source || 'geofabrik') == 'geofabrik' }}
        env: { TSS_LIMIT: "${{ inputs.limit || '0' }}" }
        run: python tools/tss/geofabrik.py 2>&1 | tee tools/tss/out/geofabrik.log
      - name: Build data set and change log
        env: { TSS_SOURCE: "${{ inputs.source || 'geofabrik' }}" }
        run: python tools/tss/fetch.py 2>&1 | tee tools/tss/out/fetch.log || true
      - uses: actions/upload-artifact@v4
        with: { name: tss-out, path: "tss/\ntools/tss/out/*.json\ntools/tss/out/*.log" }
      - name: Commit if the data changed
        if: ${{ (inputs.commit || 'true') == 'true' }}
        run: |
          cat tools/tss/out/summary.json || exit 0
          if python -c "import json,sys; sys.exit(0 if json.load(open('tools/tss/out/summary.json'))['changed'] else 1)"; then
            git config user.name tss-bot; git config user.email ci@users.noreply.github.com
            git add tss/tss.json tss/changes.json manifest.json
            git commit -m "TSS data update $(date -u +%F)" && git pull --rebase -q && git push
          else echo "no changes"; fi
