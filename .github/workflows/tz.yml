name: Update time zone data (IANA tz)
on:
  schedule:
    - cron: '7 3 * * *'        # daily check; a commit only when a new tzdb release (or corrections) appears
  push:
    branches: [main]
    paths: ['tz/corrections.json', 'tools/tz/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: tz, cancel-in-progress: false }
jobs:
  tz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build from the latest tzdata
        env: { TZ_FORCE: "${{ github.event_name == 'push' && '1' || '' }}" }
        run: which zic && python tools/tz/build.py
      - name: Commit
        run: |
          python -c "import json,sys; sys.exit(0 if json.load(open('tools/tz/summary.json'))['changed'] else 1)" || { echo "no new tzdata"; python tools/manifest.py tz; git diff --quiet manifest.json && exit 0; }
          git config user.name tz-bot; git config user.email ci@users.noreply.github.com
          mkdir -p /tmp/keep && cp tz/tz.json tz/changes.json tz/corrections.json /tmp/keep/
          for a in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p tz && cp /tmp/keep/tz.json /tmp/keep/changes.json /tmp/keep/corrections.json tz/
            python tools/manifest.py tz
            git add tz manifest.json
            git commit -qm "Time zones: tzdata $(python -c "import json;print(json.load(open('tz/tz.json'))['version'])") $(date -u +%F)" || break
            git push -q && break || sleep 15
          done
