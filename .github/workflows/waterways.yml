name: Navigable waterways near ports (OSM)
on:
  schedule:
    - cron: '13 4 * * 2'     # every Tuesday 04:13 UTC; the app repository builds port approaches from the result
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: waterways, cancel-in-progress: false }
jobs:
  waterways:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Free disk space, install osmium
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool aria2
          pip install -q osmium
          df -h / | tail -1
      - name: Planet file (AWS Open Data mirror)
        run: |
          mkdir -p /home/runner/w; URL=""
          for B in osm-planet-eu-central-1 osm-planet-us-west-2; do
            K=$(aws s3 ls --no-sign-request --recursive s3://$B/planet/pbf/ 2>/dev/null | awk '{print $4}' | grep -E 'planet-[0-9]+\.osm\.pbf$' | sort | tail -1)
            echo "$B: $K"; if [ -n "$K" ]; then URL="https://$B.s3.amazonaws.com/$K"; break; fi
          done
          [ -n "$URL" ] || URL="https://ftp5.gwdg.de/pub/misc/openstreetmap/planet.openstreetmap.org/pbf/planet-latest.osm.pbf"
          echo "planet: $URL"; t0=$(date +%s)
          aria2c -q -x 16 -s 16 -k 64M --file-allocation=none -d /home/runner/w -o planet.osm.pbf "$URL"
          echo "downloaded in $(( $(date +%s) - t0 )) s"; ls -la /home/runner/w; df -h / | tail -1
      - name: Navigable waterways near candidate ports
        run: |
          cd /home/runner/w; t0=$(date +%s)
          osmium tags-filter --overwrite -o ways.pbf planet.osm.pbf w/waterway=river,canal,fairway,tidal_channel w/seamark:type=fairway,recommended_track,navigation_line
          rm -f planet.osm.pbf; ls -la; echo "filtered in $(( $(date +%s) - t0 )) s"; df -h / | tail -1
          python $GITHUB_WORKSPACE/tools/approach/dump.py ways.pbf waterways.jsonl $GITHUB_WORKSPACE/tools/approach/ports.json
          rm -f ways.pbf; gzip -6 waterways.jsonl; ls -la; echo "done in $(( $(date +%s) - t0 )) s"
      - name: Publish (release asset)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release view waterways >/dev/null 2>&1 || gh release create waterways --title "Navigable waterways near ports" --notes "OSM rivers, canals, fairways and recommended tracks near ports with a river / inner-harbour approach. (c) OpenStreetMap contributors, ODbL 1.0. Rebuilt weekly." --latest=false
          gh release upload waterways /home/runner/w/waterways.jsonl.gz --clobber
